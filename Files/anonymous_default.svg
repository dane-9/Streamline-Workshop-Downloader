<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2c3947"/>
      <stop offset="100%" stop-color="#24282f"/>
    </radialGradient>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#171d25" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bac2c9" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#acb2b8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5e4ef" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#9eafbc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6c7e8c" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <style>
    .glass {
      fill: url(#glassFill);
      stroke: url(#glassBorder);
      stroke-width: 4;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      filter: url(#glassShadow);
    }
  </style>

  <rect width="400" height="400" fill="url(#bgGradient)"/>
  <circle class="glass" cx="200" cy="140" r="70"/>
  <path class="glass" d="M 75 420 C 75 285, 115 240, 200 240 C 285 240, 325 285, 325 420 Z"/>
</svg>
